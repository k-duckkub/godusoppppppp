<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Create Account — Join The Adventure!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bd:    #2e4f8a;
      --blue:  #4a72c0;
      --blue2: #5a88d8;
      --cream: #f0e8d0;
      --cream2:#e0d8c0;
      --sky:   #89cfe8;
      --green: #3d7820;
    }

    html { font-size: 16px; }

    body {
      background: radial-gradient(ellipse at center, #a8ddf5 0%, #6ab5e0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    /* ── Window frame ── */
    .window {
      width: min(940px, 100%);
      border: 3px solid var(--bd);
      box-shadow: 5px 5px 0 #1a2d55;
      background: var(--cream2);
    }

    /* Title bar */
    .titlebar {
      background: var(--blue);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 5px 8px;
      border-bottom: 3px solid var(--bd);
      gap: 4px;
    }
    .tb-btn {
      width: 20px; height: 20px;
      border: 2px solid var(--bd);
      background: var(--cream);
      cursor: pointer;
      font-size: 9px; font-family: monospace;
      color: var(--bd);
      display: flex; align-items: center; justify-content: center;
      user-select: none;
    }
    .tb-btn:hover { background: var(--cream2); }
    .tb-close { background: #d04040; color: #fff; }
    .tb-close:hover { background: #b03030; }

    /* ── Body layout ── */
    .body {
      display: flex;
      min-height: 540px;
    }

    /* ── LEFT PANEL ── */
    .left {
      width: 44%;
      background: var(--sky);
      border-right: 3px solid var(--bd);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    .scene-frame {
      width: 100%;
      border: 3px solid var(--bd);
      box-shadow: 3px 3px 0 #1a2d55;
      overflow: hidden;
    }

    .scene-title-bar {
      background: var(--cream);
      border-bottom: 3px solid var(--bd);
      padding: 8px 6px;
      text-align: center;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(8px, 2vw, 13px);
      color: var(--bd);
      line-height: 1.9;
    }

    canvas#scene {
      display: block;
      width: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* ── RIGHT PANEL ── */
    .right {
      flex: 1;
      background: var(--cream);
      padding: 24px 18px 18px;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .form-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .laurel-wrap {
      display: flex; flex-direction: column; gap: 3px;
      flex-shrink: 0;
    }
    .lf { width: 5px; height: 13px; background: var(--green); border-radius: 0 50% 50% 0; }
    .lr { width: 5px; height: 13px; background: var(--green); border-radius: 50% 0 0 50%; }
    .lf:nth-child(2), .lr:nth-child(2) { width: 7px; }

    .header-text { text-align: center; }
    .header-text h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(8px, 1.5vw, 13px);
      color: var(--bd);
      line-height: 1.7;
    }
    .header-text p {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(5px, 0.9vw, 8px);
      color: #888;
      margin-top: 5px;
    }

    /* Form */
    form {
      display: flex;
      flex-direction: column;
      gap: 11px;
      flex: 1;
    }

    .field { display: flex; flex-direction: column; gap: 4px; }

    .field label {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(5.5px, 0.9vw, 8px);
      color: var(--bd);
      padding-left: 38px;
    }

    .input-row { display: flex; align-items: stretch; }

    .field-icon {
      width: 34px; min-height: 36px;
      background: #bfcfe8;
      border: 2px solid var(--bd);
      border-right: none;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .field-icon svg { image-rendering: pixelated; }

    .field input {
      flex: 1;
      height: 36px;
      border: 2px solid var(--bd);
      background: #f8f4e8;
      padding: 0 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(6px, 0.9vw, 8px);
      color: #333;
      outline: none;
      min-width: 0;
      /* Prevent iOS zoom on focus */
      -webkit-text-size-adjust: 100%;
    }
    .field input:focus {
      background: #fffef5;
      border-color: var(--blue2);
      box-shadow: 0 0 0 2px rgba(74,114,192,0.25);
    }
    .field input.err-inp { border-color: #c03030; background: #fff4f4; }
    .field input[type="number"]::-webkit-inner-spin-button,
    .field input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .field input[type="number"] { -moz-appearance: textfield; }

    .err-msg {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(5px, 0.75vw, 7px);
      color: #c03030;
      padding-left: 38px;
      display: none;
    }
    .err-msg.show { display: block; }

    /* Submit button */
    .submit-btn {
      margin-top: 4px;
      height: 44px;
      background: var(--blue);
      border: 3px solid var(--bd);
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(8px, 1.3vw, 12px);
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 4px 4px 0 var(--bd);
      transition: transform .08s, box-shadow .08s, background .1s;
      touch-action: manipulation;
    }
    .submit-btn:hover { background: var(--blue2); }
    .submit-btn:active { transform: translate(4px,4px); box-shadow: none; }

    .login-link {
      text-align: center;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(4.5px, 0.75vw, 6.5px);
      color: #999;
      margin-top: 8px;
    }
    .login-link a { color: var(--blue); text-decoration: none; }
    .login-link a:hover, .login-link a:active { text-decoration: underline; }

    /* ── Success overlay ── */
    #success-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 999;
      align-items: center; justify-content: center;
      padding: 16px;
    }
    #success-overlay.show { display: flex; }

    .success-box {
      background: var(--cream);
      border: 4px solid var(--bd);
      box-shadow: 7px 7px 0 #1a2d55;
      padding: 30px 22px;
      text-align: center;
      max-width: 340px; width: 100%;
    }
    .success-box .s-icon { font-size: 44px; margin-bottom: 14px; }
    .success-box h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(10px, 3vw, 13px);
      color: var(--bd);
      margin-bottom: 12px;
      line-height: 1.8;
    }
    #s-name {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(8px, 2.5vw, 10px);
      color: var(--green);
      margin-bottom: 10px;
    }
    .success-box p {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(6px, 1.8vw, 8px);
      color: #666; line-height: 2;
      margin-bottom: 20px;
    }
    .success-btn {
      background: var(--green);
      border: 3px solid #1e4a0a;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(8px, 2.5vw, 10px);
      padding: 11px 22px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #1e4a0a;
      touch-action: manipulation;
    }
    .success-btn:hover { background: #4a8a28; }
    .success-btn:active { transform: translate(3px,3px); box-shadow: none; }

    /* ══════════════════════════════
       RESPONSIVE – MOBILE (≤ 600px)
    ══════════════════════════════ */
    @media (max-width: 600px) {
      body { padding: 0; align-items: stretch; }

      .window {
        border: none;
        box-shadow: none;
        width: 100%;
        min-height: 100vh;
      }

      /* Hide titlebar on mobile (fullscreen feel) */
      .titlebar { display: none; }

      .body {
        flex-direction: column;
        min-height: calc(100vh - 0px);
      }

      .left {
        width: 100%;
        border-right: none;
        border-bottom: 3px solid var(--bd);
        padding: 10px;
      }

      .scene-title-bar {
        font-size: 10px;
        padding: 7px;
      }

      /* Make canvas shorter on mobile to save space */
      canvas#scene { max-height: 200px; object-fit: cover; }

      .right { padding: 16px 14px 24px; }

      .form-header { margin-bottom: 14px; gap: 8px; }
      .header-text h1 { font-size: 10px; }
      .header-text p  { font-size: 7px; }

      form { gap: 10px; }

      .field label { font-size: 7px; padding-left: 36px; }

      .field-icon { width: 32px; min-height: 40px; }

      .field input {
        height: 40px;
        font-size: 8px;
        /* Prevent iOS font zoom: keep ≥16px native but override with CSS */
        font-size: max(8px, 16px);
        /* ^ but Press Start 2P 16px is too big, so use transform trick below */
        font-size: 8px;
        /* iOS zoom fix: input font must be ≥16px at native level;
           we achieve this by setting actual font-size to 16px and scaling */
        transform-origin: left center;
      }

      /* iOS zoom fix: actual rendered text size ≥16px */
      .field input { font-size: 16px; }
      .field { position: relative; }
      /* Scale down label text */
      .field label { font-size: 7px; }
      .err-msg { font-size: 6px; }

      .submit-btn {
        height: 48px;
        font-size: 11px;
      }

      .login-link { font-size: 6px; margin-top: 10px; }
    }

    /* ─── Tablet (601–840px) ─── */
    @media (min-width: 601px) and (max-width: 840px) {
      .left { width: 42%; }
      .header-text h1 { font-size: 10px; }
      .field label { font-size: 7px; }
    }
  </style>
</head>
<body>

<!-- ── Window ── -->
<div class="window">
  <div class="titlebar">
    <button class="tb-btn tb-min" title="Minimize">—</button>
    <button class="tb-btn tb-max" title="Maximize">□</button>
    <button class="tb-btn tb-close" title="Close">✕</button>
  </div>

  <div class="body">

    <!-- ── Left: Pixel art scene ── -->
    <div class="left">
      <div class="scene-frame">
        <div class="scene-title-bar">JOIN THE<br>ADVENTURE!</div>
        <canvas id="scene" width="300" height="310"></canvas>
      </div>
    </div>

    <!-- ── Right: Registration form ── -->
    <div class="right">
      <div class="form-header">
        <div class="laurel-wrap">
          <div class="lf"></div><div class="lf"></div><div class="lf"></div>
        </div>
        <div class="header-text">
          <h1>CREATE YOUR ACCOUNT</h1>
          <p>JOIN THE COMMUNITY!</p>
        </div>
        <div class="laurel-wrap">
          <div class="lr"></div><div class="lr"></div><div class="lr"></div>
        </div>
      </div>

      <form id="reg-form" novalidate>

        <!-- Full Name -->
        <div class="field">
          <label for="fullName">Full Name</label>
          <div class="input-row">
            <div class="field-icon">
              <svg width="18" height="18" viewBox="0 0 9 9" fill="none">
                <rect x="1" y="0" width="7" height="1" fill="#8b6420"/>
                <rect x="0" y="1" width="9" height="7" fill="#d4a840"/>
                <rect x="1" y="8" width="7" height="1" fill="#8b6420"/>
                <rect x="1" y="2" width="6" height="1" fill="#7a5018"/>
                <rect x="1" y="4" width="5" height="1" fill="#7a5018"/>
                <rect x="1" y="6" width="4" height="1" fill="#7a5018"/>
              </svg>
            </div>
            <input type="text" id="fullName" name="fullName"
              placeholder="Farmer Jane Doe"
              autocomplete="name" inputmode="text" />
          </div>
          <span class="err-msg" id="err-fullName"></span>
        </div>

        <!-- Nickname -->
        <div class="field">
          <label for="nickname">Nickname</label>
          <div class="input-row">
            <div class="field-icon">
              <svg width="18" height="18" viewBox="0 0 9 9" fill="none">
                <rect x="3" y="0" width="3" height="3" fill="#f5c886"/>
                <rect x="2" y="2" width="5" height="3" fill="#f5c886"/>
                <rect x="1" y="5" width="7" height="4" fill="#4a72c0"/>
                <rect x="2" y="4" width="5" height="2" fill="#f5c886"/>
              </svg>
            </div>
            <input type="text" id="nickname" name="nickname"
              placeholder="JaneBerry"
              autocomplete="nickname" inputmode="text" />
          </div>
          <span class="err-msg" id="err-nickname"></span>
        </div>

        <!-- Age -->
        <div class="field">
          <label for="age">Age</label>
          <div class="input-row">
            <div class="field-icon">
              <svg width="18" height="18" viewBox="0 0 9 9" fill="none">
                <rect x="0" y="2" width="9" height="7" fill="#c8d8f0"/>
                <rect x="0" y="2" width="9" height="3" fill="#4a72c0"/>
                <rect x="2" y="0" width="1" height="4" fill="#1a2d7c"/>
                <rect x="6" y="0" width="1" height="4" fill="#1a2d7c"/>
                <rect x="1" y="6" width="2" height="1" fill="#1a2d7c"/>
                <rect x="4" y="6" width="2" height="1" fill="#1a2d7c"/>
                <rect x="7" y="6" width="1" height="1" fill="#1a2d7c"/>
              </svg>
            </div>
            <input type="number" id="age" name="age"
              placeholder="26" min="1" max="120"
              autocomplete="off" inputmode="numeric" />
          </div>
          <span class="err-msg" id="err-age"></span>
        </div>

        <!-- Mobile -->
        <div class="field">
          <label for="mobile">Mobile</label>
          <div class="input-row">
            <div class="field-icon">
              <svg width="18" height="18" viewBox="0 0 9 9" fill="none">
                <rect x="2" y="0" width="5" height="9" fill="#4a72c0"/>
                <rect x="3" y="1" width="3" height="6" fill="#c0d8f0"/>
                <rect x="3" y="8" width="3" height="1" fill="#1a2d7c"/>
                <rect x="4" y="7" width="1" height="1" fill="#fff"/>
              </svg>
            </div>
            <input type="tel" id="mobile" name="mobile"
              placeholder="+1 555-0123"
              autocomplete="tel" inputmode="tel" />
          </div>
          <span class="err-msg" id="err-mobile"></span>
        </div>

        <!-- Invite Code -->
        <div class="field">
          <label for="inviteCode">Invite Code</label>
          <div class="input-row">
            <div class="field-icon">
              <svg width="18" height="18" viewBox="0 0 9 9" fill="none">
                <rect x="4" y="1" width="4" height="4" fill="#d4a820"/>
                <rect x="5" y="2" width="2" height="2" fill="#f8d840"/>
                <rect x="0" y="4" width="5" height="2" fill="#d4a820"/>
                <rect x="0" y="6" width="2" height="3" fill="#d4a820"/>
                <rect x="3" y="6" width="2" height="1" fill="#d4a820"/>
              </svg>
            </div>
            <input type="text" id="inviteCode" name="inviteCode"
              placeholder="SDV-STAR"
              autocomplete="off" maxlength="20"
              style="text-transform:uppercase" />
          </div>
          <span class="err-msg" id="err-inviteCode"></span>
        </div>

        <button type="submit" class="submit-btn">REGISTER NOW ★</button>

        <p class="login-link">
          ALREADY HAVE AN ACCOUNT?
          <a href="#" id="login-link">LOG IN</a>
        </p>
      </form>
    </div><!-- /right -->
  </div><!-- /body -->
</div><!-- /window -->

<!-- ── Success overlay ── -->
<div id="success-overlay">
  <div class="success-box">
    <div class="s-icon">🎉</div>
    <h2>WELCOME TO<br>THE ADVENTURE!</h2>
    <p id="s-name"></p>
    <p>Your account has been<br>created successfully!</p>
    <button class="success-btn"
      onclick="document.getElementById('success-overlay').classList.remove('show')">
      START PLAYING →
    </button>
  </div>
</div>


<!-- ════════════════════════════════════════
     SCRIPTS
════════════════════════════════════════ -->
<script>
/* ─────────────────────────────────────────
   PIXEL ART SCENE (Canvas)
───────────────────────────────────────── */
(function () {
  const canvas = document.getElementById('scene');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  function r(color, x, y, w, h) {
    ctx.fillStyle = color;
    ctx.fillRect(x|0, y|0, (w|0) || 1, (h|0) || 1);
  }

  function drawScene(frame) {
    ctx.clearRect(0, 0, W, H);

    /* Sky */
    r('#89cfe8', 0, 0, W, 178);
    r('#b0dff0', 0, 155, W, 23);  /* horizon glow */

    /* Clouds */
    cloud(14, 15, 52, 17);
    cloud(98,  8, 44, 14);
    cloud(196, 20, 55, 16);

    /* Mountain */
    mountain(212, 28, 90, 150);

    /* Ground */
    r('#5b9e35', 0, 175, W, H - 175);
    r('#4a8a28', 0, 175, W, 4);
    r('#72c048', 0, 198, W, 4);

    /* River */
    river();

    /* Background trees */
    tree(10,  86, 1.0);
    tree(34,  94, 0.85);
    tree(220, 88, 0.85);
    tree(252, 96, 0.75);

    /* Houses */
    house(12, 108, 0.78);
    house(235, 106, 0.73);

    /* Front grass sheen */
    r('#68b038', 0, 226, W, 5);

    /* Character */
    character(96, 218);

    /* Sign (character holds it) */
    sign(128, 192);

    /* Cat */
    cat(62, 234);

    /* Campfire (animated) */
    campfire(182, 226, frame);

    /* Treasure chest */
    chest(206, 222);
  }

  /* Cloud */
  function cloud(x, y, w, h) {
    r('#fff', x + w*.2, y,       w*.6, h*.45);
    r('#fff', x,        y+h*.38, w,    h*.62);
    r('#e4f2fb', x+2,   y+h*.85, w-4,  h*.15);
  }

  /* Mountain */
  function mountain(cx, peak, hw, base) {
    for (let y = peak; y <= base; y++) {
      const t  = (y - peak) / (base - peak);
      const ww = hw * t;
      const v  = 138 + t * 52 | 0;
      ctx.fillStyle = `rgb(${v},${148+t*42|0},${152+t*32|0})`;
      ctx.fillRect(cx - ww | 0, y, (ww*2)|0 || 1, 1);
    }
    for (let y = peak; y <= peak + 34; y++) {
      const t  = (y - peak) / 34;
      const ww = hw * ((y - peak) / (base - peak));
      const sw = ww * (1 - t) * 0.52;
      r('#eef5ff', cx - sw, y, sw * 2, 1);
    }
  }

  /* River */
  function river() {
    for (let y = 196; y < H; y++) {
      const t  = (y - 196) / (H - 196);
      const cx = 266 - t * 16;
      r('#4a90d9', cx,   y, 18, 1);
      r('#5aa8e8', cx+3, y,  8, 1);
      r('#6ab8f0', cx+5, y,  4, 1);
    }
  }

  /* Pine tree */
  function tree(x, y, s) {
    r('#7a5018', x+6*s,  y+24*s, 4*s, 10*s);
    r('#1a5810', x,       y+18*s, 16*s, 7*s);
    r('#228820', x+1*s,  y+13*s, 14*s, 6*s);
    r('#1a5810', x+2*s,  y+8*s,  12*s, 6*s);
    r('#228820', x+3*s,  y+4*s,  10*s, 5*s);
    r('#1a5810', x+4*s,  y,       8*s, 5*s);
    r('#32b032', x+2*s,  y+4*s,   3*s, 2*s);
    r('#32b032', x+3*s,  y,       2*s, 2*s);
  }

  /* House */
  function house(x, y, s) {
    r('#d4a060', x,       y+10*s, 22*s, 14*s);
    r('#f0c880', x+2*s,  y+11*s,  3*s,  9*s);
    r('#c09040', x+1*s,  y+11*s,  1*s,  9*s);
    r('#a8c8e8', x+10*s, y+12*s,  5*s,  4*s);
    r('#7aa8c8', x+12*s, y+12*s,  1*s,  4*s);
    for (let i = 0; i <= 11; i++)
      r('#c03028', x+i*s, y+(10-i)*s, (22-i*2)*s, 3*s);
    r('#901820', x, y+10*s, 22*s, 1*s);
    r('#a08060', x+16*s, y+2*s, 3*s, 8*s);
    r('#c8c8c8', x+15*s, y+1*s, 5*s, 2*s);
  }

  /* Character */
  function character(x, y) {
    r('#4a3010', x+3,  y+18, 5,  2);
    r('#4a3010', x+11, y+18, 5,  2);
    r('#5a7a38', x+3,  y+12, 13, 7);
    r('#4a6828', x+5,  y+14, 1,  5);
    r('#4a6828', x+12, y+14, 1,  5);
    r('#f0f0f0', x+3,  y+5,  14, 8);
    r('#d8d8d8', x+4,  y+6,   3, 6);
    r('#8b6020', x+15, y+5,   5, 8);
    r('#c8a040', x+16, y+6,   3, 6);
    r('#8b6020', x+16, y+9,   3, 1);
    r('#f5c886', x+1,  y+7,   3, 5);

  /* Animation loop */
  let frame = 0;
  function loop() { drawScene(frame++); requestAnimationFrame(loop); }
  loop();
})();


/* ─────────────────────────────────────────
   FORM VALIDATION
───────────────────────────────────────── */
(function () {
  const form = document.getElementById('reg-form');

  const rules = {
    fullName: {
      validate: v => v.trim().split(/\s+/).filter(Boolean).length >= 2,
      msg: 'Please enter your first and last name'
    },
    nickname: {
      validate: v => v.trim().length >= 2,
      msg: 'Nickname must be at least 2 characters'
    },
    age: {
      validate: v => { const n = Number(v); return Number.isInteger(n) && n >= 1 && n <= 120; },
      msg: 'Please enter a valid age (1 – 120)'
    },
    mobile: {
      validate: v => /^\+?[\d\s\-().]{7,20}$/.test(v.trim()),
      msg: 'Please enter a valid phone number'
    },
    inviteCode: {
      validate: v => /^[A-Za-z0-9\-_]{3,20}$/.test(v.trim()),
      msg: 'Code: 3–20 letters, numbers, or dashes'
    }
  };

  function setErr(id, msg) {
    const el = document.getElementById(id);
    el.classList.add('err-inp');
    const sp = document.getElementById('err-' + id);
    sp.textContent = msg;
    sp.classList.add('show');
  }
  function clrErr(id) {
    document.getElementById(id).classList.remove('err-inp');
    document.getElementById('err-' + id).classList.remove('show');
  }

  /* Live-clear errors on typing */
  Object.keys(rules).forEach(id => {
    document.getElementById(id).addEventListener('input', () => clrErr(id));
  });

  /* Auto-uppercase invite code */
  const inv = document.getElementById('inviteCode');
  inv.addEventListener('input', function () {
    const pos = this.selectionStart;
    this.value = this.value.toUpperCase();
    this.setSelectionRange(pos, pos);
  });

  /* Submit handler */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    let ok = true;

    Object.entries(rules).forEach(([id, rule]) => {
      const val = document.getElementById(id).value;
      if (!rule.validate(val)) { setErr(id, rule.msg); ok = false; }
      else clrErr(id);
    });

    if (ok) {
      const nick = document.getElementById('nickname').value.trim();
      document.getElementById('s-name').textContent = '★  ' + nick + '  ★';
      document.getElementById('success-overlay').classList.add('show');
    }
  });

  /* Window button polish */
  document.querySelector('.tb-close').addEventListener('click', () => {
    if (confirm('Close the registration window?'))
      document.querySelector('.window').style.display = 'none';
  });
  document.querySelector('.tb-min').addEventListener('click', () => {
    const b = document.querySelector('.body');
    b.style.display = b.style.display === 'none' ? 'flex' : 'none';
  });

  /* Log-in link */
  document.getElementById('login-link').addEventListener('click', e => {
    e.preventDefault();
    alert('🗝️  Login page coming soon!');
  });
})();
</script>
</body>
