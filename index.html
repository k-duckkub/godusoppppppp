<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Create Account — Join The Adventure!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bd: #2e4d88;
      --blue: #4a72c0;
      --blue2: #5c84d4;
      --cream: #f2ecd8;
      --cream2: #e6dfc6;
      --sky: #9fd4ea;
      --green: #3b7318;
    }
    html { font-size: 16px; }
    body {
      background: linear-gradient(155deg, #c8ecfc 0%, #88c8e8 55%, #56aad4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .window {
      width: min(960px, 100%);
      border: 3px solid var(--bd);
      box-shadow: 0 0 0 1px #162540, 6px 6px 0 #162540;
      background: var(--cream2);
    }
    .titlebar {
      background: linear-gradient(180deg, #6090d8 0%, #4a72c0 65%, #3860b0 100%);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 5px 8px;
      border-bottom: 3px solid var(--bd);
      gap: 5px;
    }
    .tb-btn {
      width: 20px; height: 20px;
      border: 2px solid var(--bd);
      background: var(--cream);
      cursor: pointer;
      font-size: 9px; font-family: monospace;
      color: var(--bd);
      display: flex; align-items: center; justify-content: center;
      user-select: none; line-height: 1;
    }
    .tb-btn:hover { background: var(--cream2); }
    .tb-close { background: #cc3838; color: #fff; border-color: #8b1818; }
    .tb-close:hover { background: #aa2828; }
    .body { display: flex; min-height: 560px; }
    .left {
      width: 44%;
      background: linear-gradient(180deg, #aad8f0 0%, #90cae8 100%);
      border-right: 3px solid var(--bd);
      display: flex; flex-direction: column; align-items: center;
      padding: 14px;
    }
    .scene-wrap {
      width: 100%;
      border: 3px solid var(--bd);
      box-shadow: 4px 4px 0 #162540;
      overflow: hidden;
    }
    .scene-header {
      background: var(--cream);
      border-bottom: 3px solid var(--bd);
      padding: 9px 8px;
      text-align: center;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(8px, 2.2vw, 14px);
      color: var(--bd);
      line-height: 1.85;
      letter-spacing: 1px;
    }
    canvas#scene {
      display: block; width: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .right {
      flex: 1; background: var(--cream);
      padding: 26px 22px 20px;
      display: flex; flex-direction: column;
    }
    .form-header {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 20px;
    }
    .laurel-svg { flex-shrink: 0; }
    .header-text { text-align: center; }
    .header-text h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(8px, 1.55vw, 14px);
      color: var(--bd); line-height: 1.75; letter-spacing: 0.5px;
    }
    .header-text p {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(5px, 0.85vw, 8px);
      color: #888; margin-top: 6px; letter-spacing: 1px;
    }
    form { display: flex; flex-direction: column; gap: 12px; flex: 1; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(6px, 0.88vw, 8px);
      color: var(--bd); padding-left: 42px;
    }
    .input-row { display: flex; align-items: stretch; }
    .field-icon {
      width: 38px; min-height: 40px;
      background: #c4d4ee;
      border: 2px solid var(--bd);
      border-right: 2px solid #8aa0c8;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .field-icon svg { image-rendering: pixelated; display: block; }
    .field input {
      flex: 1; height: 40px;
      border: 2px solid var(--bd); border-left: none;
      background: #faf6ed;
      padding: 0 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(6px, 0.9vw, 8.5px);
      color: #2a2a2a; outline: none; min-width: 0;
    }
    .field input:focus {
      background: #fffdf5;
      border-color: var(--blue2);
      box-shadow: inset 0 0 0 1px var(--blue2);
    }
    .field input.err-inp { border-color: #bb2828; background: #fff3f3; }
    .field input[type="number"]::-webkit-inner-spin-button,
    .field input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .field input[type="number"] { -moz-appearance: textfield; }
    .err-msg {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(4.5px, 0.7vw, 6.5px);
      color: #bb2828; padding-left: 42px; display: none;
    }
    .err-msg.show { display: block; }
    .submit-btn {
      margin-top: 6px; height: 50px;
      background: var(--blue);
      border: 3px solid var(--bd); color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(9px, 1.4vw, 13px);
      cursor: pointer; letter-spacing: 2px;
      box-shadow: 0 5px 0 #1e3870, 4px 4px 0 #1e3870;
      transition: transform .08s, box-shadow .08s, background .1s;
      touch-action: manipulation;
    }
    .submit-btn:hover { background: var(--blue2); }
    .submit-btn:active { transform: translate(4px,5px); box-shadow: none; }
    .login-link {
      text-align: center;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(4.5px, 0.7vw, 6.5px);
      color: #aaa; margin-top: 10px;
    }
    .login-link a { color: var(--blue); text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }
    #success-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.70); z-index: 999;
      align-items: center; justify-content: center; padding: 16px;
    }
    #success-overlay.show { display: flex; }
    .success-box {
      background: var(--cream);
      border: 4px solid var(--bd);
      box-shadow: 0 0 0 1px #162540, 8px 8px 0 #162540;
      padding: 32px 26px; text-align: center;
      max-width: 360px; width: 100%;
    }
    .success-box .s-icon { font-size: 48px; margin-bottom: 16px; }
    .success-box h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(10px, 3vw, 14px);
      color: var(--bd); margin-bottom: 14px; line-height: 1.8;
    }
    #s-name {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(8px, 2.5vw, 11px);
      color: var(--green); margin-bottom: 12px;
    }
    .success-box .s-msg {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(6px, 1.8vw, 8px);
      color: #666; line-height: 2.1; margin-bottom: 22px;
    }
    .success-btn {
      background: var(--green); border: 3px solid #1e4a0a; color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(8px, 2.5vw, 10px);
      padding: 12px 24px; cursor: pointer;
      box-shadow: 0 4px 0 #1e4a0a, 3px 3px 0 #1e4a0a;
      touch-action: manipulation;
    }
    .success-btn:hover { background: #4a8a28; }
    .success-btn:active { transform: translate(3px,4px); box-shadow: none; }
    @media (max-width: 600px) {
      body { padding: 0; align-items: flex-start; }
      .window { border: none; box-shadow: none; width: 100%; min-height: 100dvh; }
      .titlebar { display: none; }
      .body { flex-direction: column; }
      .left { width: 100%; border-right: none; border-bottom: 3px solid var(--bd); padding: 10px; }
      .scene-header { font-size: 10px; padding: 7px; }
      canvas#scene { max-height: 210px; }
      .right { padding: 16px 14px 28px; }
      .form-header { margin-bottom: 14px; }
      .header-text h1 { font-size: 10px; }
      .header-text p { font-size: 7px; }
      form { gap: 11px; }
      .field label { font-size: 7px; padding-left: 40px; }
      .field-icon { width: 36px; min-height: 42px; }
      .field input { height: 42px; font-size: 16px; }
      .err-msg { font-size: 6px; padding-left: 40px; }
      .submit-btn { height: 50px; font-size: 11px; }
      .login-link { font-size: 6px; }
    }
    @media (min-width: 601px) and (max-width: 860px) {
      .left { width: 42%; }
      .header-text h1 { font-size: 10px; }
      .field label { font-size: 7px; }
      .field input { font-size: 7.5px; }
    }
  </style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <button class="tb-btn" title="Minimize" onclick="document.querySelector('.body').style.display=document.querySelector('.body').style.display==='none'?'flex':'none'">&#8212;</button>
    <button class="tb-btn" title="Maximize">&#9633;</button>
    <button class="tb-btn tb-close" title="Close" onclick="if(confirm('Close?'))document.querySelector('.window').style.display='none'">&#10005;</button>
  </div>
  <div class="body">
    <div class="left">
      <div class="scene-wrap">
        <div class="scene-header">JOIN THE<br>ADVENTURE!</div>
        <canvas id="scene" width="360" height="380"></canvas>
      </div>
    </div>
    <div class="right">
      <div class="form-header">
        <svg class="laurel-svg" width="24" height="46" viewBox="0 0 24 46" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="20" cy="42" rx="9" ry="5" fill="#3b7318" transform="rotate(-12 20 42)"/>
          <ellipse cx="15" cy="31" rx="8.5" ry="4.5" fill="#4a8a20" transform="rotate(-28 15 31)"/>
          <ellipse cx="10" cy="20" rx="8" ry="4" fill="#3b7318" transform="rotate(-46 10 20)"/>
          <ellipse cx="5" cy="10" rx="7" ry="3.5" fill="#4a8a20" transform="rotate(-62 5 10)"/>
          <ellipse cx="1" cy="2" rx="5.5" ry="3" fill="#3b7318" transform="rotate(-75 1 2)"/>
          <ellipse cx="21" cy="40" rx="5" ry="2.5" fill="#5aaa28" transform="rotate(-12 21 40)" opacity="0.55"/>
          <ellipse cx="16" cy="29" rx="4.5" ry="2" fill="#5aaa28" transform="rotate(-28 16 29)" opacity="0.55"/>
          <ellipse cx="11" cy="18" rx="4" ry="2" fill="#5aaa28" transform="rotate(-46 11 18)" opacity="0.55"/>
          <ellipse cx="6" cy="8" rx="3.5" ry="1.8" fill="#5aaa28" transform="rotate(-62 6 8)" opacity="0.55"/>
        </svg>
        <div class="header-text">
          <h1>CREATE YOUR ACCOUNT</h1>
          <p>JOIN THE COMMUNITY!</p>
        </div>
        <svg class="laurel-svg" width="24" height="46" viewBox="0 0 24 46" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform:scaleX(-1)">
          <ellipse cx="20" cy="42" rx="9" ry="5" fill="#3b7318" transform="rotate(-12 20 42)"/>
          <ellipse cx="15" cy="31" rx="8.5" ry="4.5" fill="#4a8a20" transform="rotate(-28 15 31)"/>
          <ellipse cx="10" cy="20" rx="8" ry="4" fill="#3b7318" transform="rotate(-46 10 20)"/>
          <ellipse cx="5" cy="10" rx="7" ry="3.5" fill="#4a8a20" transform="rotate(-62 5 10)"/>
          <ellipse cx="1" cy="2" rx="5.5" ry="3" fill="#3b7318" transform="rotate(-75 1 2)"/>
          <ellipse cx="21" cy="40" rx="5" ry="2.5" fill="#5aaa28" transform="rotate(-12 21 40)" opacity="0.55"/>
          <ellipse cx="16" cy="29" rx="4.5" ry="2" fill="#5aaa28" transform="rotate(-28 16 29)" opacity="0.55"/>
          <ellipse cx="11" cy="18" rx="4" ry="2" fill="#5aaa28" transform="rotate(-46 11 18)" opacity="0.55"/>
          <ellipse cx="6" cy="8" rx="3.5" ry="1.8" fill="#5aaa28" transform="rotate(-62 6 8)" opacity="0.55"/>
        </svg>
      </div>
      <form id="reg-form" novalidate>
        <div class="field">
          <label for="fullName">Full Name</label>
          <div class="input-row">
            <div class="field-icon">
              <svg width="20" height="20" viewBox="0 0 10 10">
                <rect x="1" y="0" width="8" height="1" fill="#7a5010"/>
                <rect x="0" y="1" width="10" height="8" fill="#e0b848"/>
                <rect x="1" y="9" width="8" height="1" fill="#7a5010"/>
                <rect x="0" y="1" width="1" height="8" fill="#9a6828"/>
                <rect x="9" y="1" width="1" height="8" fill="#9a6828"/>
                <rect x="1" y="2" width="7" height="1" fill="#6a4008"/>
                <rect x="1" y="4" width="6" height="1" fill="#6a4008"/>
                <rect x="1" y="6" width="5" height="1" fill="#6a4008"/>
                <rect x="1" y="8" width="4" height="1" fill="#6a4008"/>
                <rect x="1" y="1" width="7" height="1" fill="#f0d060" opacity="0.6"/>
              </svg>
            </div>
            <input type="text" id="fullName" name="fullName" placeholder="Farmer Jane Doe" autocomplete="name" inputmode="text" />
          </div>
          <span class="err-msg" id="err-fullName"></span>
        </div>
        <div class="field">
          <label for="nickname">Nickname</label>
          <div class="input-row">
            <div class="field-icon">
              <svg width="20" height="20" viewBox="0 0 10 10">
                <rect x="3" y="0" width="4" height="1" fill="#f5c886"/>
                <rect x="2" y="1" width="6" height="3" fill="#f5c886"/>
                <rect x="3" y="4" width="4" height="1" fill="#e8b870"/>
                <rect x="1" y="5" width="8" height="5" fill="#4a72c0"/>
                <rect x="2" y="5" width="6" height="1" fill="#5a82d0"/>
                <rect x="4" y="4" width="2" height="2" fill="#f5c886"/>
                <rect x="3" y="2" width="1" height="1" fill="#1a1a1a"/>
                <rect x="6" y="2" width="1" height="1" fill="#1a1a1a"/>
                <rect x="3" y="3" width="1" height="1" fill="#b07040"/>
                <rect x="4" y="4" width="2" height="1" fill="#b07040"/>
                <rect x="6" y="3" width="1" height="1" fill="#b07040"/>
              </svg>
            </div>
            <input type="text" id="nickname" name="nickname" placeholder="JaneBerry" autocomplete="nickname" inputmode="text" />
          </div>
          <span class="err-msg" id="err-nickname"></span>
        </div>
        <div class="field">
          <label for="age">Age</label>
          <div class="input-row">
            <div class="field-icon">
              <svg width="20" height="20" viewBox="0 0 10 10">
                <rect x="0" y="1" width="10" height="9" fill="#d0e0f8"/>
                <rect x="0" y="1" width="10" height="3" fill="#4a72c0"/>
                <rect x="0" y="0" width="10" height="1" fill="#2e4d88"/>
                <rect x="2" y="0" width="1" height="3" fill="#1a2d60"/>
                <rect x="7" y="0" width="1" height="3" fill="#1a2d60"/>
                <rect x="1" y="5" width="2" height="1" fill="#2e4d88"/>
                <rect x="4" y="5" width="2" height="1" fill="#2e4d88"/>
                <rect x="7" y="5" width="2" height="1" fill="#2e4d88"/>
                <rect x="1" y="7" width="2" height="1" fill="#2e4d88"/>
                <rect x="4" y="7" width="2" height="1" fill="#4a72c0"/>
                <rect x="7" y="7" width="2" height="1" fill="#2e4d88"/>
              </svg>
            </div>
            <input type="number" id="age" name="age" placeholder="26" min="1" max="120" autocomplete="off" inputmode="numeric" />
          </div>
          <span class="err-msg" id="err-age"></span>
        </div>
        <div class="field">
          <label for="mobile">Mobile</label>
          <div class="input-row">
            <div class="field-icon">
              <svg width="20" height="20" viewBox="0 0 10 10">
                <rect x="2" y="0" width="6" height="10" fill="#4a72c0"/>
                <rect x="2" y="0" width="6" height="1" fill="#2e4d88"/>
                <rect x="2" y="9" width="6" height="1" fill="#2e4d88"/>
                <rect x="3" y="1" width="4" height="6" fill="#c8e0f8"/>
                <rect x="3" y="1" width="4" height="1" fill="#a8c8e8"/>
                <rect x="4" y="8" width="2" height="1" fill="#3a62a8"/>
                <rect x="3" y="3" width="1" height="1" fill="#6890d0"/>
                <rect x="5" y="3" width="1" height="1" fill="#6890d0"/>
                <rect x="4" y="4" width="2" height="1" fill="#5080c0"/>
              </svg>
            </div>
            <input type="tel" id="mobile" name="mobile" placeholder="+1 555-0123" autocomplete="tel" inputmode="tel" />
          </div>
          <span class="err-msg" id="err-mobile"></span>
        </div>
        <div class="field">
          <label for="inviteCode">Invite Code</label>
          <div class="input-row">
            <div class="field-icon">
              <svg width="20" height="20" viewBox="0 0 10 10">
                <rect x="5" y="1" width="4" height="4" fill="#d4a820"/>
                <rect x="6" y="2" width="2" height="2" fill="#f8d840"/>
                <rect x="7" y="2" width="1" height="1" fill="#ffe870"/>
                <rect x="7" y="3" width="1" height="1" fill="#a07010"/>
                <rect x="0" y="4" width="6" height="2" fill="#d4a820"/>
                <rect x="0" y="4" width="6" height="1" fill="#e8c030"/>
                <rect x="0" y="6" width="2" height="2" fill="#d4a820"/>
                <rect x="3" y="6" width="2" height="1" fill="#d4a820"/>
              </svg>
            </div>
            <input type="text" id="inviteCode" name="inviteCode" placeholder="SDV-STAR" autocomplete="off" maxlength="20" style="text-transform:uppercase" />
          </div>
          <span class="err-msg" id="err-inviteCode"></span>
        </div>
        <button type="submit" class="submit-btn">REGISTER NOW &#9733;</button>
        <p class="login-link">ALREADY HAVE AN ACCOUNT? <a href="#" id="login-link">LOG IN</a></p>
      </form>
    </div>
  </div>
</div>
<div id="success-overlay">
  <div class="success-box">
    <div class="s-icon">&#127881;</div>
    <h2>WELCOME TO<br>THE ADVENTURE!</h2>
    <p id="s-name"></p>
    <p class="s-msg">Your account has been<br>created successfully!</p>
    <button class="success-btn" onclick="document.getElementById('success-overlay').classList.remove('show')">START PLAYING &#8594;</button>
  </div>
</div>
<script>
(function(){
  const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
  function r(c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,Math.max(1,w|0),Math.max(1,h|0));}
  function cloud(x,y,w,h){r('#ffffff',x+w*.18,y,w*.64,h*.45);r('#ffffff',x,y+h*.38,w,h*.62);r('#eef8fe',x+2,y+h*.82,w-4,h*.18);}
  function mountain(cx,peakY,hw,baseY){for(let y=peakY;y<=baseY;y++){const t=(y-peakY)/(baseY-peakY),ww=hw*t,vR=(148+t*48)|0,vG=(160+t*38)|0,vB=(172+t*20)|0;ctx.fillStyle=`rgb(${vR},${vG},${vB})`;ctx.fillRect((cx-ww)|0,y,Math.max(1,(ww*2)|0),1);}for(let y=peakY;y<=peakY+38;y++){const t=(y-peakY)/38,ww=hw*((y-peakY)/(baseY-peakY)),sw=ww*(1-t)*0.55;r('#eef5ff',cx-sw,y,sw*2,1);}}
  function river(){for(let y=205;y<H;y++){const t=(y-205)/(H-205),cx=316-t*14;r('#4a90d9',cx,y,26,1);r('#5aace8',cx+3,y,14,1);r('#70c0f0',cx+6,y,6,1);}}
  function tree(x,y,s){r('#7a5018',x+7*s,y+26*s,5*s,12*s);r('#5a3808',x+9*s,y+26*s,2*s,12*s);[['#1e6e18',0,y+20*s,18*s,8*s],['#28882a',1*s,y+15*s,16*s,7*s],['#1e6e18',2*s,y+10*s,14*s,7*s],['#28882a',3*s,y+5*s,12*s,7*s],['#1e6e18',4*s,y,9*s,7*s]].forEach(([c,dx,dy,dw,dh])=>r(c,x+dx,dy,dw,dh));r('#3aaa3a',x+2*s,y+5*s,4*s,3*s);r('#3aaa3a',x+3*s,y,3*s,2*s);r('#3aaa3a',x+s,y+15*s,4*s,2*s);}
  function house(x,y,s){r('#daa860',x,y+10*s,24*s,14*s);r('#f0c878',x+2*s,y+11*s,4*s,10*s);r('#c89048',x+s,y+11*s,2*s,10*s);r('#a8cce8',x+12*s,y+12*s,6*s,5*s);r('#80a8cc',x+14*s,y+12*s,s,5*s);r('#80a8cc',x+12*s,y+14*s,6*s,s);for(let i=0;i<=12;i++)r('#c03028',x+i*s,y+(10-i)*s*0.85,(24-i*2)*s,3*s);r('#902018',x,y+10*s,24*s,s);r('#a88058',x+17*s,y+2*s,4*s,9*s);r('#c0c0b8',x+16*s,y+s,6*s,2*s);r('#d8d8d0',x+17*s,y-s,3*s,2*s);}

(function(){
  const form=document.getElementById('reg-form');
  const rules={
    fullName:{validate:v=>v.trim().split(/\s+/).filter(Boolean).length>=2,msg:'Please enter first and last name'},
    nickname:{validate:v=>v.trim().length>=2,msg:'Nickname must be at least 2 characters'},
    age:{validate:v=>{const n=Number(v);return Number.isFinite(n)&&n>=1&&n<=120&&Number.isInteger(n);},msg:'Please enter a valid age (1 - 120)'},
    mobile:{validate:v=>/^\+?[\d\s\-().]{7,20}$/.test(v.trim()),msg:'Please enter a valid phone number'},
    inviteCode:{validate:v=>/^[A-Za-z0-9\-_]{3,20}$/.test(v.trim()),msg:'Code: 3-20 letters, numbers, or dashes'}
  };
  function showErr(id,msg){document.getElementById(id).classList.add('err-inp');const sp=document.getElementById('err-'+id);sp.textContent=msg;sp.classList.add('show');}
  function clrErr(id){document.getElementById(id).classList.remove('err-inp');document.getElementById('err-'+id).classList.remove('show');}
  Object.keys(rules).forEach(id=>document.getElementById(id).addEventListener('input',()=>clrErr(id)));
  const inv=document.getElementById('inviteCode');
  inv.addEventListener('input',function(){const p=this.selectionStart;this.value=this.value.toUpperCase();this.setSelectionRange(p,p);});
  form.addEventListener('submit',function(e){e.preventDefault();let ok=true;Object.entries(rules).forEach(([id,rule])=>{if(!rule.validate(document.getElementById(id).value)){showErr(id,rule.msg);ok=false;}else clrErr(id);});if(ok){const nick=document.getElementById('nickname').value.trim();document.getElementById('s-name').textContent='★  '+nick+'  ★';document.getElementById('success-overlay').classList.add('show');}});
  document.getElementById('login-link').addEventListener('click',e=>{e.preventDefault();alert('🗝️  Login page coming soon!');});
})();
</script>
